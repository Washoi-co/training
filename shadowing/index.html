/* シャドーイングだけの見た目（共通は /ui.css）。2026-11-17 見本 round2：白い地・灰の押せるかたまり・赤は1画面に1か所（一覧＝続きの動画／練習＝再生） */
html,body{background:var(--card)}
#home,#lesson{display:flex;flex-direction:column}
.nav .pill{background:none;border-radius:0;padding:12px 0 12px 14px;font-family:var(--fd);font-weight:700;font-size:14px;color:var(--ink)}   /* やり方・本コース（本コースは ui.js が無料版に足す）：文字だけ */
.navr #howto{order:-1}
#home .large{margin-top:8px}
/* 一覧：レベルのタブ */
.lvt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:28px 0 0}
.lvt button{height:52px;border-radius:6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;line-height:1}
.lvt b{font-family:var(--en);font-weight:900;font-size:20px}
.lvt small{font-family:var(--fd);font-weight:700;font-size:10px;color:var(--mute)}
.lvt button[aria-selected="true"]{background:var(--ink);color:var(--on)}
.lvt button[aria-selected="true"] small{color:rgba(255,255,255,.7)}
.lvnote{margin:12px 2px 0;font-size:12.5px;color:var(--mute)}
/* 一覧：動画の行（済み＝✓、続きの1本＝赤） */
.shl{display:grid;gap:6px;margin:28px 0 0}
.vid{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;min-height:64px;padding:10px 16px;background:var(--bg);border-radius:6px;text-decoration:none;color:var(--ink)}
.vid .n{font-family:var(--en);font-weight:900;font-size:17px;color:var(--mute)}
.vid .t{font-family:var(--en);font-weight:900;font-size:16.5px;line-height:1.25;min-width:0}
.vid .t small{display:block;font-family:var(--f);font-weight:400;font-size:12px;color:var(--mute);margin-top:2px}
.vid .st{display:flex;align-items:center;gap:6px;font-family:var(--en);font-weight:900;font-size:13px;white-space:nowrap}
.vid svg{width:18px;height:18px;flex:none}
.vid.done .n,.vid.done .t{color:var(--mute)}
.vid.next{background:var(--accent);color:var(--on);box-shadow:0 10px 30px -12px rgba(255,45,22,.5)}
.vid.next .n,.vid.next small{color:rgba(255,255,255,.85)}
.vid.locked{opacity:.55}
.foot{margin:48px 2px 0;padding:0;font-size:11px;line-height:1.6}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 0}
.back{display:flex;align-items:center;gap:4px;height:44px;padding:0 14px 0 8px;background:var(--bg);border-radius:6px;font-family:var(--fd);font-weight:700;font-size:14px;text-decoration:none;color:var(--ink)}
.back svg,.alt svg{width:16px;height:16px}
.stepn{font-family:var(--en);font-weight:900;font-size:14px}
.stepn i{font-style:normal;color:var(--mute)}
.ttl{font-family:var(--en);font-weight:900;font-size:26px;letter-spacing:-.01em;line-height:1.15;margin:14px 2px 0}
.player{position:relative;margin:18px 0 0;aspect-ratio:16/9;background:var(--ink);border-radius:6px;overflow:hidden}
.player video{display:block;width:100%;height:100%}
.cover{position:absolute;left:0;right:0;bottom:0;background:var(--ink);pointer-events:none}
.subt{margin:6px 0 0;min-height:3.4em;padding:12px 14px;background:var(--ink);color:var(--on);border-radius:6px;line-height:1.45}
.subt .e{font-family:var(--en);font-weight:700;font-size:16px}
.subt .j{font-size:12.5px;opacity:.75;margin-top:2px}
.pbar{display:flex;align-items:center;gap:12px;margin:14px 0 0}
.play{width:56px;height:56px;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--on);border-radius:6px;box-shadow:0 10px 30px -10px rgba(255,45,22,.5)}
.play svg{width:22px;height:22px}
.pbar input{flex:1;min-width:0;margin:0;accent-color:var(--ink)}
.tm{font-family:var(--en);font-weight:700;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.again{display:grid;justify-items:center;align-content:center;gap:2px;width:64px;height:56px;flex:none;background:var(--bg);border-radius:6px;font-family:var(--fd);font-weight:700;font-size:10.5px}
.again svg{width:18px;height:18px}

.ctl{display:grid;gap:8px;margin:22px 0 0}
.sg{display:grid;grid-template-columns:44px 1fr;align-items:center}
.sg>span{font-family:var(--fd);font-weight:700;font-size:12.5px;color:var(--mute)}
.sg>div{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;background:var(--bg);border-radius:6px}
.sg button{height:42px;border-radius:4px;font-family:var(--fd);font-weight:700;font-size:14px}
.sg button.en{font-family:var(--en);font-weight:900}
.sg button[aria-pressed="true"]{background:var(--ink);color:var(--on)}
#rep>div{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
#rep button{font-size:13px}
/* 段：3回聞く／質問に答える */
#panel{margin:30px 0 0}
#panel h2,.modal h2{font-family:var(--fd);font-weight:900;font-size:15px;letter-spacing:.04em;margin:0 0 12px}
.syn{font-size:13.5px;line-height:1.7;color:var(--mute);margin:0 0 14px}
.count{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.count button{height:58px;border-radius:6px;background:var(--bg);font-family:var(--en);font-weight:900;font-size:22px;color:var(--mute)}
.count button.on{background:var(--ink);color:var(--on)}
.fwd,.alt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;margin:10px 0 0;padding:0 18px;border-radius:6px;background:var(--bg);color:var(--mute);font-family:var(--fd);font-weight:900;font-size:17px;text-decoration:none;text-align:left}
.fwd:not(:disabled){background:var(--ink);color:var(--on)}
.fwd span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fwd svg{width:20px;height:20px;flex:none}
.alt{justify-content:flex-start;gap:6px;min-height:48px;font-size:14px;font-weight:700;color:var(--ink)}
.q{margin:0 0 22px}
.q p{margin:0 0 8px;font-weight:700;font-size:15px;line-height:1.5}
.q button{display:block;width:100%;min-height:44px;text-align:left;background:var(--bg);border-radius:6px;padding:11px 14px;margin-top:6px;font-size:14.5px;border:1.5px solid transparent}
.q button:disabled{cursor:default}
.q button.ok{border-color:var(--ok);background:#E9F6EF}
.q button.ng{border-color:var(--ng);background:#FCECEA}
.q .ex{font-size:13px;line-height:1.6;color:var(--mute);margin-top:6px}
.fin{margin:8px 0 12px}
.fin p{margin:0;font-size:14px;color:var(--mute)}
.fin p b{font-family:var(--en);font-weight:900;font-size:22px;color:var(--ink)}
.credit{margin:36px 2px 0;font-size:11px;line-height:1.6}
/* やり方 */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{max-width:420px;margin:0;padding:20px;border-radius:6px}
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:6px;background:var(--ink);color:var(--on);font-family:var(--fd);font-weight:900;font-size:16px;margin-top:14px}
</style>

<script>
const LEVELS = {1: "英検®4級程度（中1〜2）", 2: "英検®3級程度（中3）", 3: "英検®準2級程度（高1〜2）", 4: "英検®2級程度（高3）", 5: "英検®準1級程度（大学〜）"};
const STEPS = [   /* 2026-10-18：2つだけ。① 3回聞く → ② 質問に答える */
  {t: "3回聞く", subs: "off", listen: true},
  {t: "質問に答える", quiz: true},
];
const TIMES = 3;
const $ = s => document.querySelector(s);
const v = $("#v");
let DB, L, step = 0, subs = "en", stopAt = null, loopSeg = null, lv = 0;   // lv＝一覧で見ているレベル

const store = {
  get() {
    try {
      const s = JSON.parse(localStorage.getItem("shadowing:v1")) || {};
      /* 2026-11：旧レベル3（L3-*）はレベル5（L5-*）に。✓を引き継ぐ（無いときだけ写す） */
      let moved = false;
      for (const k of Object.keys(s)) { const m = /^L3-(\d+)$/.exec(k); if (m && !s["L5-" + m[1]]) { s["L5-" + m[1]] = s[k]; moved = true; } }
      if (moved) localStorage.setItem("shadowing:v1", JSON.stringify(s));
      return s;
    } catch (e) { return {}; }
  },
  set(f) { try { const s = store.get(); f(s); localStorage.setItem("shadowing:v1", JSON.stringify(s)); } catch (e) {} },
};
const prog = id => store.get()[id] || {};
const setProg = (id, k, val) => store.set(s => { s[id] = Object.assign(s[id] || {}, {[k]: val}); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const icon = n => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const srcName = x => x.source === "nasa" ? "NASA" : x.source === "apush" ? "A-PUSH講師" : "VOA";
/* 続きの1本：途中の動画 → 最後に終えた動画の次 → まだの最初（今日＆計画の「今日のシャドーイング」と一覧の赤い行） */
function nextLesson() {
  const all = DB.lessons, p = x => prog(x.id);
  const lastDone = all.reduce((k, x, i) => p(x).done ? i : k, -1);
  return all.find(x => p(x).step && !p(x).done) || all.slice(lastDone + 1).find(x => !p(x).done) || all.find(x => !p(x).done) || all[0];
}

if ((window.SITE || {}).free) fetch("data/locked.json").then(r => r.ok ? r.json() : []).then(l => { window.SH_LOCKED = l; if (typeof DB !== "undefined" && DB && !location.hash.slice(1)) home(); }).catch(() => {});
fetch("data/lessons.json").then(r => r.json()).then(d => {
  DB = d; DB.lessons = DB.lessons.filter(x => x.active);
  $("#credits").textContent = [...new Set(DB.lessons.map(x => x.credit))].join(" / ");
  if (/[?&]today=1/.test(location.search)) {   /* 今日＆計画の「今日のシャドーイング」から */
    const x = nextLesson();
    history.replaceState(null, "", location.pathname + (x ? "#" + x.id : ""));
  }
  route(); window.onhashchange = route;
  function route() { const id = location.hash.slice(1); const x = DB.lessons.find(l => l.id === id); x ? open(x) : home(); }
  if (!store.get().intro) $("#intro").hidden = false;
});
$("#howto").onclick = () => { $("#intro").hidden = false; };
$("#introOk").onclick = () => { $("#intro").hidden = true; store.set(s => s.intro = 1); };

function home() {
  v.pause(); $("#lesson").hidden = true; $("#home").hidden = false;
  /* 無料版：本コースの動画も鍵付きで並べる（data/locked.json。押すと「本生徒のみ」のシート） */
  const LK = window.SH_LOCKED || [], nx = nextLesson();
  const lvs = [1, 2, 3, 4, 5].filter(k => DB.lessons.some(x => x.level === k) || LK.some(x => x.level === k));
  if (!lvs.includes(lv)) lv = nx && lvs.includes(nx.level) ? nx.level : lvs[0];
  $("#lvs").innerHTML = lvs.map(k => `<button class="press" role="tab" data-lv="${k}" aria-selected="${k === lv}"><b>${k}</b><small>レベル</small></button>`).join("");
  $("#lvnote").textContent = LEVELS[lv] || "";
  const mine = DB.lessons.filter(x => x.level === lv);
  $("#sh-list").innerHTML = mine.map((x, i) => {
    const p = prog(x.id), mins = Math.round((x.lines[x.lines.length-1].end - x.lines[0].start) / 60 * 10) / 10;
    const st = p.done ? icon("check") : (p.step || p.heard ? `${(p.step || 0) + 1} / 2` : "") + icon("chev");
    return `<a class="vid press${p.done ? " done" : x === nx ? " next" : ""}" data-id="${x.id}" href="#${x.id}"><span class="n">${i + 1}</span><span class="t">${esc(x.title)}<small>${srcName(x)} ・ 約${mins}分</small></span><span class="st">${st}</span></a>`;
  }).join("") + LK.filter(x => x.level === lv).map((x, i) => `<a class="vid locked" href="#" data-lock="この動画"><span class="n">${mine.length + i + 1}</span><span class="t">${esc(x.title)}<small>${x.source === "nasa" ? "NASA" : "VOA"}${x.mins ? ` ・ 約${x.mins}分` : ""} ・ 本コース</small></span><span class="st">${icon("lock")}</span></a>`).join("");
}
$("#lvs").onclick = e => { const b = e.target.closest("[data-lv]"); if (b) { lv = +b.dataset.lv; home(); } };

function open(x) {
  L = x; lv = x.level; loopSeg = null; $("#home").hidden = true; $("#lesson").hidden = false;
  v.src = L.video; $("#credit").textContent = L.credit;
  const rep = $("#rep"), mn = L.repeat === "minute";   // レベル5：1分ずつの区間をくり返す／ほか：今の文をもう一回
  rep.hidden = !mn; $("#again").hidden = mn;
  if (mn) {
    const n = Math.ceil((L.lines[L.lines.length-1].end) / 60);
    rep.innerHTML = `<span>区間</span><div><button data-seg="-1" aria-pressed="true">全部</button>` +
      Array.from({length: n}, (_, i) => `<button data-seg="${i}">${i}〜${i + 1}分</button>`).join("") + `</div>`;
  }
  go(Math.min(prog(L.id).step || 0, 1)); window.scrollTo(0, 0);
}

function go(n) {
  step = n; setProg(L.id, "step", n); const S = STEPS[n];
  $("#stitle").textContent = L.title; $("#snum").innerHTML = `${n + 1}<i> / 2</i>`;
  setSubs("en");   // 字幕は英語だけ・選ばせない（kimi 2026-11-17）
  const p = prog(L.id), heard = Math.min(p.heard || 0, TIMES);
  let h = `<h2>${S.t}</h2>`;
  if (n === 0 && L.synopsis) h += `<p class="syn"><b>ここまでのあらすじ：</b>${esc(L.synopsis)}</p>`;
  if (S.listen) {
    h += `<div class="count" id="heard">${[0, 1, 2].map(i => `<button class="press${i < heard ? " on" : ""}" data-h="${i}" aria-label="${i + 1}回目">${i + 1}</button>`).join("")}</div>`;
    h += `<button class="fwd press" id="next" ${heard < TIMES ? "disabled" : ""}><span>質問に答える</span>${icon("chev")}</button>`;
  }
  if (S.quiz) h += quiz();
  if (n > 0) h += `<button class="alt press" id="prev">${icon("back")}もう一度聞く</button>`;
  $("#panel").innerHTML = h;
  const nx = $("#next"); if (nx) nx.onclick = () => { go(n + 1); $("#lesson").scrollIntoView(); };
  const pv = $("#prev"); if (pv) pv.onclick = () => { setProg(L.id, "heard", 0); go(0); };
  const hd = $("#heard"); if (hd) hd.onclick = e => { const b = e.target.closest("[data-h]"); if (b && +b.dataset.h <= heard) { setProg(L.id, "heard", Math.max(heard, +b.dataset.h + 1)); go(0); } };
}
/* 最後まで聞いたら1回に数える（3回まで） */
v.addEventListener("ended", () => { if (L && STEPS[step].listen) { const k = prog(L.id).heard || 0; if (k < TIMES) { setProg(L.id, "heard", k + 1); go(0); } } });


function quiz() {
  const res = prog(L.id).quiz || [];
  let h = L.quiz.map((q, i) => `<div class="q" data-q="${i}"><p>Q${i + 1}. ${esc(q.q)}</p>${q.choices.map((c, j) => {
    const cls = res[i] == null ? "" : j === q.answer ? "ok" : j === res[i] ? "ng" : "";
    return `<button class="${cls}" data-c="${j}" ${res[i] != null ? "disabled" : ""}>${esc(c)}</button>`;
  }).join("")}${res[i] != null ? `<div class="ex">${res[i] === q.answer ? "⭕ 正解。" : "✕ "}${esc(q.explain)}</div>` : ""}</div>`).join("");
  if (res.filter(x => x != null).length === L.quiz.length) {
    const ok = L.quiz.filter((q, i) => res[i] === q.answer).length;
    setProg(L.id, "done", 1);
    const td = new Date().toDateString();  // 同じ動画でも、日が変われば「今日の1本」に数える（画面を描き直しても1日1回）
    if (prog(L.id).doneOn !== td) { apMark("shadow", 1, L.id); setProg(L.id, "doneOn", td); }
    const all = DB.lessons, k = all.indexOf(L), nxt = all[k + 1];
    h += `<div class="fin"><h2>おつかれさまでした</h2><p>クイズ <b>${ok}</b> / ${L.quiz.length} 問正解</p>
      ${nxt ? `<a class="fwd press" href="#${nxt.id}"><span>次の動画へ：${esc(nxt.title)}</span>${icon("chev")}</a>` : ""}
      <a class="alt press" href="${DB.links.line}" target="_blank" rel="noopener">新しい動画をLINEで受け取る</a>
      <a class="alt press" href="${DB.links.meeting}" target="_blank" rel="noopener">学習の相談をする（【無料】45分オンライン面談）</a></div>`;
  }
  setTimeout(() => document.querySelectorAll(".q").forEach(d => d.onclick = e => {
    const b = e.target.closest("button[data-c]"); if (!b || b.disabled) return;
    const r = prog(L.id).quiz || []; r[+d.dataset.q] = +b.dataset.c; setProg(L.id, "quiz", r); go(1);
  }));
  return h;
}

/* ---- プレーヤー ---- */
function setSubs(m) {
  subs = m;
  document.querySelectorAll("[data-subs]").forEach(b => b.setAttribute("aria-pressed", b.dataset.subs === m));
  const off = m === "off";
  $("#cover").hidden = !(off && L.cover_height > 0); $("#cover").style.height = (L.cover_height * 100) + "%";
  $("#sub").hidden = off;
  if (L.audio_only) { // 文字だけの動画：字幕なしの段は音声＋静止画に替える
    const want = off ? L.audio_only : L.video;
    if (!v.src.endsWith(want)) { const t = v.currentTime, play = !v.paused, r = v.playbackRate; v.src = want; v.addEventListener("loadedmetadata", () => { v.currentTime = t; v.playbackRate = r; if (play) v.play(); }, {once: true}); }
  }
  tick();
}
function setRate(r) { v.playbackRate = r; v.defaultPlaybackRate = r; document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.rate === r)); }
document.querySelectorAll("[data-subs]").forEach(b => b.onclick = () => setSubs(b.dataset.subs));
document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => setRate(+b.dataset.rate));
setRate(1);

const curLine = () => { const t = v.currentTime; let k = -1; L.lines.forEach((l, i) => { if (l.start <= t + 0.05) k = i; }); return k; };
function seekLine(i) { v.currentTime = L.lines[i].start; stopAt = L.lines[i].end; v.play(); }
$("#again").onclick = () => { const k = curLine(); if (k >= 0) seekLine(k); };
$("#rep").onclick = e => {
  const b = e.target.closest("[data-seg]"); if (!b) return;
  const s = +b.dataset.seg; loopSeg = s < 0 ? null : s;
  document.querySelectorAll("[data-seg]").forEach(x => x.setAttribute("aria-pressed", x === b));
  if (loopSeg != null) { v.currentTime = loopSeg * 60; v.play(); }
};
function tick() {
  if (!L) return;
  const t = v.currentTime;
  if (stopAt != null && t >= stopAt) { v.pause(); stopAt = null; }
  if (loopSeg != null && (t >= (loopSeg + 1) * 60 || t >= v.duration - 0.2)) v.currentTime = loopSeg * 60;
  const l = L.lines.find(x => x.start <= t && t <= x.end + 0.3);
  $("#se").textContent = l ? l.en : ""; $("#sj").textContent = l && subs === "both" ? l.ja : "";
}
v.addEventListener("timeupdate", tick);
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
$("#pp").onclick = () => v.paused ? v.play() : v.pause();
v.addEventListener("play", () => { $("#pp").innerHTML = icon("pause"); $("#pp").setAttribute("aria-label", "止める"); });
v.addEventListener("pause", () => { $("#pp").innerHTML = icon("play"); $("#pp").setAttribute("aria-label", "再生"); });
v.addEventListener("loadedmetadata", () => $("#seek").max = v.duration);
v.addEventListener("timeupdate", () => { $("#seek").value = v.currentTime; $("#tm").textContent = fmt(v.currentTime); });
$("#seek").oninput = e => { v.currentTime = +e.target.value; };
v.onclick = () => $("#pp").click();
v.addEventListener("seeking", () => { if (stopAt != null && (v.currentTime < stopAt - 30 || v.currentTime > stopAt)) stopAt = null; });
</script>
<script src="/say.js"></script><script src="/lock.js"></script><script src="/install.js" defer></script>  <!-- ホーム画面に追加の案内・LINEから来た人・記録の引き継ぎ（2026-10-16） -->
<script src="/ui.js" defer></script>
</body>
</html>
