  <style>
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script>
/* 設定の exams をカードに。問題は /exam/<id>.json、画面は /exam/。同じ group（英検の各級）は1つにまとめる。名前は最初の空白で 大きい名前／小さな副題 に分ける */
(function(){var S=window.SITE||{},ex=S.exams||[];
  if(S.daily)document.getElementById("daily").hidden=false;
  if(!ex.length)return;
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
  document.getElementById("mine-note").textContent="試験";
  var seen={};ex=ex.filter(function(e){if(!e.group)return true;if(seen[e.group])return false;seen[e.group]=1;return true;}).map(function(e){return e.group?{id:e.group,isGroup:true,title:e.groupTitle||e.group}:e;});
  document.getElementById("exam-list").innerHTML=ex.map(function(e){var href=e.isGroup?"/exam/?group="+encodeURIComponent(e.id):e.bank?"/exam/?exam="+encodeURIComponent(e.id):"/exam/?id="+encodeURIComponent(e.id);
    var t=String(e.title),i=t.indexOf(" "),nm=i>0?t.slice(0,i):t,sub=i>0?t.slice(i+1):(e.minutes?"約"+e.minutes+"分":"");
    return '<a class="mcard" href="'+href+'"><span><b>'+esc(nm)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</span><svg class="arr"><use href="#i-arr"/></svg></a>';}).join("");
})();
</script>
